version: "3.8"

services:
  fraud-detection:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"  # API
      - "8501:8501"  # Streamlit Dashboard
    env_file:
      - ../.env
    volumes:
      - fraud_data:/app/data
      - fraud_db:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  fraud_data:
  fraud_db:
